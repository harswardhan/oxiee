        if(style.name === "QN + Dot") finalName = style.template.replace(/NAME_DOT/g, toStylish(input, 'dot'));
        if(style.name.includes("King")) finalName = style.template.replace(/NAME_MID/g, toStylish(input, 'mid'));
        if(style.name === "99% Headshot") finalName = style.template.replace(/NAME_UPPER/g, toStylish(input, 'upper'));
        out.innerHTML += `<div class="output-box" onclick="copyText('${finalName.replace(/'/g,"\\'")}')"><span class="style-label">${style.name}</span>${finalName}</div>`;
    });
    document.getElementById('ffProCount').textContent = `${ffNameStyles.length} styles generated`;
}

function genFFProGuild() {
    const input = document.getElementById('ffProGuildInput').value.trim() || 'OXIE';
    const out = document.getElementById('ffProGuildOutput');
    out.innerHTML = '';
    ffGuildStyles.forEach(style => {
        let finalName = style.template.replace(/GUILD/g, toStylish(input, 'upper'));
        out.innerHTML += `<div class="output-box" onclick="copyText('${finalName.replace(/'/g,"\\'")}')"><span class="style-label">${style.name}</span>${finalName}</div>`;
    });
    document.getElementById('ffProGuildCount').textContent = `${ffGuildStyles.length} guild styles`;
}

function genFFProBio() {
    const name = document.getElementById('ffProBioName').value.trim() || 'Oxie';
    const age = document.getElementById('ffProBioAge').value.trim() || '18';
    const rank = document.getElementById('ffProBioRank').value.trim() || 'Grandmaster';
    const mood = document.getElementById('ffProBioMood').value;
    const out = document.getElementById('ffProBioOutput');
    out.innerHTML = '';
    
    ffBioTemplates[mood].forEach((template, i) => {
        let finalBio = template.replace(/NAME/g, toStylish(name)).replace(/AGE/g, age).replace(/RANK/g, rank);
        out.innerHTML += `<div class="output-box" onclick="copyText(\`${finalBio}\`)"><span class="style-label">Bio Style ${i+1}</span><pre style="white-space:pre-wrap;margin:0;font-family:inherit;">${finalBio}</pre></div>`;
    });
    document.getElementById('ffProBioCount').textContent = `${ffBioTemplates[mood].length} bio styles`;
}

// Auto-load
window.onload = () => {
    document.getElementById('inputBox').value = 'Oxie';
    genFancy();
    document.getElementById('ffInput').value = 'Oxie';
    genFF();
    document.getElementById('ffProInput').value = 'Oxie';
    genFFPro();
};
</script>
</body>
