function applyMap(text, map) {
    return text.split('').map(c => map[c] || c).join('');
}

function toUni(text, offset1, offset2) {
    return text.split('').map(c => {
        const code = c.charCodeAt(0);
        if(code >= 65 && code <= 90) return String.fromCodePoint(code + offset1);
        if(code >= 97 && code <= 122) return String.fromCodePoint(code + offset2);
        return c;
    }).join('');
}

function addDiacritic(text, diacritic) {
    return text.split('').join(diacritic) + diacritic;
}

    const cursiveMap = charMaps['Cursive'];
    const scriptMap = charMaps['Cursive'];

    // 1. Basic Cases
    styles.push(['Normal', input]);
    styles.push(['UPPERCASE', input.toUpperCase()]);
    styles.push(['lowercase', input.toLowerCase()]);
    styles.push(['Title Case', input.replace(/\b\w/g, c => c.toUpperCase())]);
    styles.push(['aLtErNaTe', input.split('').map((c,i)=>i%2?c.toUpperCase():c.toLowerCase()).join('')]);
    styles.push(['InVeRsE', input.split('').map((c,i)=>i%2?c.toLowerCase():c.toUpperCase()).join('')]);

    spacers.forEach(s => {
        styles.push([`Spaced ${s}`, input.split('').join(s)]);
    });

    // 3. Character Maps - 10 maps
    Object.entries(charMaps).forEach(([name, map]) => {
        styles.push([name, applyMap(input, map)]);

        ['Math Sans', 120159, 120153], ['Math Sans Bold', 120211, 120205], ['Math Sans Italic', 120263, 120257],
        ['Math Sans Bold Italic', 120315, 120309], ['Math Monospace', 120367, 120361], ['Math Double Struck', 120055, 120049]
    ];
    unicodeFonts.forEach(([name, o1, o2]) => {
        styles.push([name, toUni(input, o1, o2)]);

    const diacritics = [

// TOOL 3: UNIQUE CODE GENERATOR
function genCode(length) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let code = 'OXIE-';
    for(let i = 0; i < length; i++) {
        if(length === 32 && [8,13,18,23].includes(i)) code += '-';
        else code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    document.getElementById('codeOutput').innerHTML = `<div class="output-box" onclick="copyText('${code}')">${code}</div>`;
}
