function applyMap(text, map) {
    return text.split('').map(c => map[c] || c).join('');
}

function toUni(text, offset1, offset2) {
    return text.split('').map(c => {
        const code = c.charCodeAt(0);
        if(code >= 65 && code <= 90) return String.fromCodePoint(code + offset1);
        if(code >= 97 && code <= 122) return String.fromCodePoint(code + offset2);
        return c;
    }).join('');
}

function addDiacritic(text, diacritic) {
    return text.split('').join(diacritic) + diacritic;
}

function generateText() {
    const input = document.getElementById('inputBox').value;
    const outputs = document.getElementById('outputs');

    if(!input) {
        outputs.innerHTML = '';

    styles.push(['UPPERCASE', input.toUpperCase()]);

    styles.push(['InVeRsE', input.split('').map((c,i)=>i%2?c.toLowerCase():c.toUpperCase()).join('')]);

    styles.push(['U_n_d_e_r', input.split('').join('_')]);
    styles.push(['D-a-s-h-e-d', input.split('').join('-')]);

    styles.push(['B\\a\\c\\k', input.split('').join('\\')]);
    styles.push(['P+l+u+s', input.split('').join('+')]);

        styles.push([name, applyMap(input, map)]);

        ['Italic', 120263, 120257],
        ['Bold Italic', 120315, 120309],

        ['Monospace', 120367, 120361]
    ];

    unicodeFonts.forEach(([name, o1, o2]) => {
        styles.push([name, toUni(input, o1, o2)]);
    });

    // 5. Diacritic/Combining Marks - 35 styles
    const diacritics = [
        ['Strike', '̶'], ['Underline', '̲'], ['Double Underline', '̳'],

        ['Palatalized', '̑'], ['Retroflex', '̢']
    ];

    diacritics.forEach(([name, mark]) => {
        styles.push([name, addDiacritic(input, mark)]);

function copyText(text) {
    navigator.clipboard.writeText(text);
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 1000);
}
